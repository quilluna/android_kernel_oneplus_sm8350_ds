name: Build Droidspaces kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch repo
        uses: actions/checkout@v4
        with:
          path: patches

      - name: Clone kernel source
        run: |
          git clone --depth 1 https://github.com/crdroidandroid/android_kernel_oneplus_sm8350 -b 17.0 kernel

      - name: Setup Neutron Clang
        run: |
          mkdir -p toolchain
          cd toolchain
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/06092026/neutron-clang-06092026.tar.zst
          tar -xf neutron-clang-06092026.tar.zst
          rm neutron-clang-06092026.tar.zst
          echo "$GITHUB_WORKSPACE/toolchain/bin" >> $GITHUB_PATH

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.run_id }}
          restore-keys: |
            ccache-

      - name: Apply patches
        run: |
          cd kernel
          patch -p1 < ../patches/001.GKI-below-6.12-fix_sysvipc_kabi_1_2_3.patch
          patch -p1 < ../patches/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch

      - name: Setup build environment
        run: |
          sudo apt update
          sudo apt install -y build-essential bc flex bison libssl-dev ccache

      - name: Setup .config
        run: |
          cd kernel
          mkdir -p out
          cp ../patches/.config out/.config

      - name: Build kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          export CCACHE_DIR=~/.ccache
          make O=out LLVM=1 LLVM_IAS=1 ARCH=arm64 -j$(nproc) CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          make O=out LLVM=1 LLVM_IAS=1 ARCH=arm64 -j$(nproc) CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" LOCALVERSION="-quilluna"

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Image
          path: kernel/out/arch/arm64/boot/Image

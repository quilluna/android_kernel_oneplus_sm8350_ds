name: Build Droidspaces kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        run: |
          git clone --depth 1 https://github.com/crdroidandroid/android_kernel_oneplus_sm8350 -b 16.0 kernel
          cd kernel

      - name: Checkout patch repo
        uses: actions/checkout@v4
        with:
          path: patches

      - name: Setup Neutron Clang
        run: |
          mkdir -p toolchain
          cd toolchain
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/30072026/neutron-clang-30072026.tar.zst
          tar -xf neutron-clang-30072026.tar.zst
          rm neutron-clang-30072026.tar.zst
          echo "$GITHUB_WORKSPACE/toolchain/bin" >> $GITHUB_PATH
      
      - name: Apply patches
        run: |
          cd kernel
          git apply ../patches/*.patch || echo "Patches may not apply cleanly"

      - name: Setup build environment
        run: |
          sudo apt update
          sudo apt install -y build-essential bc flex bison libssl-dev ccache
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/30072026/neutron-clang-30072026.tar.zst
          tar -xf neutron-clang-30072026.tar.zst
          rm neutron-clang-30072026.tar.zst
          cd ..

      - name: Download .config
        run: |
          cd kernel
          mkdir out
          cp ../patches/.config out/.config

      - name: Build kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          make O=out LLVM=1 ARCH=arm64 -j$(nproc) CC="clang" olddefconfig
          make O=out LLVM=1 ARCH=arm64 -j16 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" | tee build.txt

      - name: Upload Image.gz
        uses: actions/upload-artifact@v4
        with:
          name: Image
          path: out/kernel/arch/arm64/boot/Image.gz
          
